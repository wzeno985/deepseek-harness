name: Fork fast checks

# Fork-only fast signal: the static gate set on a standard hosted runner.
#
# The upstream lanes in ci.yml run the full inventory (coverage, snapshots,
# benchmarks, Windows, Python) and stay available by re-enabling that workflow.
# Trimming jobs inside ci.yml is not the alternative here: ci-workflow.spec.ts
# pins node-24-bench's `if` and every lane's fallback label, so cutting a job
# rewrites the guard spec and hides that the upstream lanes still run as
# written. A separate workflow keeps both facts true.
on:
  pull_request:

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  DSH_GATE_FAIL_FAST: '1'

concurrency:
  group: fork-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-static:
    name: fork / static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Use runner-owned temporary storage
        run: |
          echo "TMPDIR=${{ runner.temp }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Redirect Node compile cache to runner temp
        run: echo "NODE_COMPILE_CACHE=${{ runner.temp }}/node-compile-cache" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:static

      # The static gate set is a list of verifier scripts, so a workflow or
      # guard-spec regression only surfaces in the unit lane — the lane this fork
      # does not run. ci-workflow.spec.ts pins exactly those invariants and takes
      # under a second, so the fast lane runs it directly instead of the whole
      # scripts/ suite (whose parallel load is unrelated to this check).
      - name: Run workflow guard spec
        run: pnpm exec vitest run scripts/ci-workflow.spec.ts
